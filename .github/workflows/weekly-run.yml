name: Weekly VaanAI Insight Run

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday, 6:00 AM UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab too

jobs:
  run-agent:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # one location failing shouldn't cancel the others
      matrix:
        location:
          - name: "Lake Mead, NV/AZ"
            bbox: "-114.75 36.00 -114.30 36.25"
          # Add more locations here, same shape:
          # - name: "Lake Powell, UT/AZ"
          #   bbox: "-111.25 37.00 -110.75 37.50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run agent for ${{ matrix.location.name }}
        run: |
          python agentic_water_monitor_groq.py \
            --location "${{ matrix.location.name }}" \
            --bbox ${{ matrix.location.bbox }} \
            --goal "Compare the most recently available clear scene to a scene from roughly one year earlier for this location. Avoid cloudy or snow-covered scenes. Decide if the change is significant and explain a likely driver." \
            --model "openai/gpt-oss-120b"
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
